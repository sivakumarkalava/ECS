<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Men's Fashion Store</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f4f4f4;
      color:#222;
    }

    header{
      background:#111;
      color:white;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
    }

    header h1{
      font-size:28px;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      transition:0.3s;
    }

    nav a:hover{
      color:#f39c12;
    }

    .hero{
      height:90vh;
      background:url('https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1400&auto=format&fit=crop') center/cover;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      padding:20px;
    }

    .hero-content{
      background:rgba(0,0,0,0.6);
      padding:40px;
      border-radius:10px;
    }

    .hero h2{
      font-size:50px;
      margin-bottom:15px;
    }

    .hero p{
      font-size:18px;
      margin-bottom:20px;
    }

    .btn{
      padding:12px 25px;
      background:#f39c12;
      border:none;
      color:white;
      cursor:pointer;
      font-size:16px;
      border-radius:5px;
      transition:0.3s;
    }

    .btn:hover{
      background:#d68910;
    }

    .products{
      padding:60px 8%;
    }

    .section-title{
      text-align:center;
      margin-bottom:40px;
      font-size:35px;
    }

    .product-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:320px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
    }

    .card-content h3{
      margin-bottom:10px;
    }

    .price{
      color:#f39c12;
      font-size:20px;
      margin-bottom:15px;
    }

    footer{
      background:#111;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:50px;
    }

    @media(max-width:768px){
      .hero h2{
        font-size:35px;
      }

      nav{
        display:none;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>MEN STYLE</h1>

    <nav>
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">Collection</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h2>Modern Men's Fashion</h2>
      <p>Discover trendy outfits and premium collections.</p>
      <button class="btn" onclick="shopNow()">Shop Now</button>
    </div>
  </section>

  <section class="products">
    <h2 class="section-title">Trending Collection</h2>

    <div class="product-grid">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=800&auto=format&fit=crop">
        <div class="card-content">
          <h3>Casual Jacket</h3>
          <p class="price">₹2,499</p>
          <button class="btn">Add to Cart</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=800&auto=format&fit=crop">
        <div class="card-content">
          <h3>Premium T-Shirt</h3>
          <p class="price">₹999</p>
          <button class="btn">Add to Cart</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=800&auto=format&fit=crop">
        <div class="card-content">
          <h3>Stylish Hoodie</h3>
          <p class="price">₹1,799</p>
          <button class="btn">Add to Cart</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=800&auto=format&fit=crop">
        <div class="card-content">
          <h3>Classic Shirt</h3>
          <p class="price">₹1,299</p>
          <button class="btn">Add to Cart</button>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 MEN STYLE | All Rights Reserved</p>
  </footer>

  <script>
    function shopNow() {
      alert("Welcome to Men's Fashion Store!");
    }
  </script>

</body>
</html>
